# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ecosort
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: GP rules, GA memberships and ANFIS are kept in process memory,
    # so several workers would each hold different state.
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ECOSORT_SECRET_KEY
        generateValue: true
